name: databricks-deploy-dev

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resources/**"
      - "databricks.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/databricks-deploy-dev.yml"
      - ".github/scripts/export-bundle-env.sh"
  workflow_dispatch: {}

jobs:
  deploy:
    name: databricks bundle deploy (dev)
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: databricks-deploy-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v7

      # The bundle builds the wheel with uv
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: databricks/setup-cli@v1.21.0

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: read Terraform outputs
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: bash .github/scripts/export-bundle-env.sh dev

      - name: databricks bundle deploy
        env:
          BUNDLE_VAR_deploy_sp_application_id: ${{ vars.AZURE_CLIENT_ID }}
          BUNDLE_VAR_job_sp_application_id: ${{ vars.DEV_JOB_SP_APPLICATION_ID }}
          BUNDLE_VAR_admins_group_name: ${{ vars.ADMINS_GROUP_NAME }}
          BUNDLE_VAR_environment_group_name: ${{ vars.DEV_GROUP_NAME }}
          BUNDLE_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: databricks bundle deploy -t dev
